name: 更新 Shadowrocket 规则集

on:
  schedule:
    # 每天北京时间 04:00 左右运行;GitHub 的定时任务可能有延迟
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rules
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 转换并校验规则集
        run: python3 scripts/build_rules.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add direct.list proxy.list reject.list
          if git diff --cached --quiet; then
            echo "规则没有变化,无需提交"
          else
            git commit -m "更新 Shadowrocket 规则集 $(date -u +%F)"
            git push
          fi
